<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seatwork 1: Candidate Verification System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.3.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.3.1/core.js"></script>

    <style>
        body {
            background-color: #eef2f7;
            font-family: Arial, sans-serif;
            color: #263449;
        }

        .container {
            background-color: white;
            max-width: 550px;
            margin-top: 80px;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #244b7a;
            font-weight: bold;
            margin-bottom: 15px;
        }

        p {
            text-align: center;
            color: #65748b;
        }

        input {
            padding: 12px !important;
            border-radius: 6px !important;
        }

        input:focus {
            border-color: #477fc1 !important;
            box-shadow: 0 0 5px #b5d4f5 !important;
        }

        button {
            width: 100%;
            padding: 10px !important;
            margin-top: 8px;
            font-weight: bold !important;
            border-radius: 6px !important;
        }

        .btn-success {
            background-color: #244b7a !important;
            border-color: #244b7a !important;
        }

        .btn-success:hover {
            background-color: #193657 !important;
        }

        .btn-secondary {
            background-color: #e3e9f1 !important;
            border-color: #e3e9f1 !important;
            color: #263449 !important;
        }

        .btn-secondary:hover {
            background-color: #d0d9e5 !important;
        }

        h3 {
            text-align: center;
            color: #244b7a;
            margin-top: 25px;
        }

        #result {
            margin-top: 15px;
            padding: 12px;
            border-radius: 6px;
            background-color: #f4f7fb;
            color: #263449;
            overflow-wrap: break-word;
        }
    </style>
</head>
<body class="container mt-5">

    <h1>Candidate Verification System</h1>
    <p>Enter your first and last name to verify your eligibility.</p>

    <input type="text" id="first_name" class="form-control mb-3" placeholder="First Name">
    <input type="text" id="last_name" class="form-control mb-3" placeholder="Last Name">
    
    <button type="button" class="btn btn-success" py-click="check_member">Verify</button>
    <button type="button" class="btn btn-secondary" py-click="clear_fields">Clear</button>

    <h3 class="mt-4">Result</h3>
    <p id="result"></p>

    <py-script src="main.py"></py-script>
</body>
</html>
